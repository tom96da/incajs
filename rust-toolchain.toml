# Pins the rustc version, so the Linux and macOS CI jobs compile with the same one.
# `rust-version` in Cargo.toml equals this channel. Bump both together.
# The resolver (`resolver = "3"`) reads `rust-version` and skips a dependency that needs a newer
# rustc.
[toolchain]
channel = "1.98.0"
components = ["clippy", "rustfmt"]
