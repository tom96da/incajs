#:schema https://json.schemastore.org/cargo.json

# Copyright (c) 2026 tom96da
# SPDX-License-Identifier: MIT OR Apache-2.0

[package]
name = "inca-bridge"
description = "Binds a QuickJS realm to inca's retained virtual tree: the native bridge (__inca_native__) JS-side renderers drive, and the turns of the engine that carry events, timers and frame callbacks into JS."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords.workspace = true
publish = false

[dependencies]
inca-document = { path = "../inca-document" }
inca-jsenv = { path = "../inca-jsenv" }
inca-node = { path = "../inca-node" }
inca-style = { path = "../inca-style" }
rquickjs.workspace = true
serde_json = { workspace = true, optional = true }

[features]
# Exposes `test_support` for tests.
test-support = ["inca-document/test-support", "dep:serde_json"]

[dev-dependencies]
# Enables the callback test hook of inca-jsenv for this crate's tests.
inca-jsenv = { path = "../inca-jsenv", features = ["test-support"] }
rstest.workspace = true
serde_json.workspace = true
# `modifiers_of` turns a gpui modifier set into the payload the tests fire.
inca-gpui = { path = "../inca-gpui" }
inca-test-macros = { path = "../inca-test-macros" }
env_logger.workspace = true
# Enables this crate's own `test-support` feature for its tests and clippy.
inca-bridge = { path = ".", features = ["test-support"] }
# test-support gates gpui's TestPlatform/TestAppContext/#[gpui::test]; see
# third_party/zed/crates/gpui/src/gpui.rs's `cfg(any(test, feature =
# "test-support"))` gate.
gpui = { workspace = true, features = ["test-support"] }

[lints]
workspace = true
