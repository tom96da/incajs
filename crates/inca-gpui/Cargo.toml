#:schema https://json.schemastore.org/cargo.json

# Copyright (c) 2026 tom96da
# SPDX-License-Identifier: MIT OR Apache-2.0

[package]
name = "inca-gpui"
description = "The retained virtual tree and gpui element/event layer inca renders through — no QuickJS dependency of its own."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
readme = "README.md"
keywords.workspace = true
publish = false

[lib]
name = "inca_gpui"

[[example]]
name = "gpui_hello_world"
path = "examples/gpui/hello_world.rs"

[dependencies]
gpui.workspace = true

[dev-dependencies]
env_logger.workspace = true
# test-support gates gpui's TestPlatform/TestAppContext/#[gpui::test] — see
# third_party/zed/crates/gpui/src/gpui.rs's `cfg(any(test, feature =
# "test-support"))` gate.
gpui = { workspace = true, features = ["test-support"] }

[target.'cfg(target_os = "macos")'.dependencies]
# font-kit is required on macOS (gpui_macos) for any text to render at all —
# without it, gpui_macos silently draws every other primitive but skips text.
gpui_platform = { workspace = true, features = ["font-kit"] }

[target.'cfg(any(target_os = "linux", target_os = "freebsd"))'.dependencies]
gpui_platform = { workspace = true, features = ["wayland", "x11"] }


[lints]
workspace = true
