# TESTING.md is the source of truth for what must pass; this only runs it.

name: CI

permissions: {}

on:
  push:
    branches:
      - main
      - develop
      - feature/*
      - release/*
      - hotfix/*
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.sha }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # Gates the jobs below. Filtering with `on: paths:` instead would leave a
  # required status check unreported, blocking the pull request forever.
  changed:
    name: Detect changed areas
    timeout-minutes: 5
    runs-on: ubuntu-latest
    # The filter reads the event's changed files through the API.
    permissions:
      contents: read
      pull-requests: read
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      js: ${{ steps.filter.outputs.js }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Filter paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            rust:
              - 'crates/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              # cargo test evaluates this package's build output
              - 'packages/core/**'
              - '.github/workflows/ci.yml'
            js:
              - 'packages/**'
              - 'examples/**'
              - 'npm/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'tsconfig*.json'
              - 'oxlint.config.ts'
              - 'oxfmt.config.ts'
              - '.github/workflows/ci.yml'

  build:
    name: "Build: Node.js 26, ubuntu-latest"
    needs: changed
    if: needs.changed.outputs.js == 'true'
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Set node version to 26
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm

      - name: Install deps
        run: pnpm ci

      - name: Build
        run: pnpm -r build

  lint:
    name: "Lint: Node.js 26, ubuntu-latest"
    needs: [changed, build]
    if: needs.changed.outputs.js == 'true'
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Set node version to 26
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm

      - name: Install deps
        run: pnpm ci

      # Root scripts, so examples/ is covered too — it defines no `pretest`.
      - name: Lint
        run: pnpm run lint

      - name: Check formatting
        run: pnpm run format

      - name: Typecheck
        run: pnpm run typecheck

  # One job per version instead of a strategy.matrix, so a skip keeps its name.
  test-node-22:
    name: "Test: Node.js 22, ubuntu-latest"
    needs: [changed, build]
    if: needs.changed.outputs.js == 'true'
    timeout-minutes: 15
    runs-on: ubuntu-latest
    env:
      NODE_VERSION: "22"
    steps: &test_node_steps
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Set node version to ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install deps
        run: pnpm ci

      - name: Test
        run: pnpm exec vitest run

  test-node-24:
    name: "Test: Node.js 24, ubuntu-latest"
    needs: [changed, build]
    if: needs.changed.outputs.js == 'true'
    timeout-minutes: 15
    runs-on: ubuntu-latest
    env:
      NODE_VERSION: "24"
    steps: *test_node_steps

  test-node-26:
    name: "Test: Node.js 26, ubuntu-latest"
    needs: [changed, build]
    if: needs.changed.outputs.js == 'true'
    timeout-minutes: 15
    runs-on: ubuntu-latest
    env:
      NODE_VERSION: "26"
    steps: *test_node_steps

  # gpui_platform's features differ per platform, so both need checking.
  rust-ubuntu:
    name: "Rust: ubuntu:22.04"
    needs: changed
    if: needs.changed.outputs.rust == 'true'
    timeout-minutes: 30
    runs-on: ubuntu-latest
    # Same image as cd.yml's build-host: its glibc is the floor for every
    # binary published from there.
    container: ubuntu:22.04
    # A container's default shell is sh, and these steps are written in bash.
    defaults:
      run:
        shell: bash
    steps: &rust_steps
      # Ahead of the checkout: a bare image lacks git, curl and a compiler.
      # The gpui half is .devcontainer/Dockerfile's list, minus the
      # display-only packages.
      - name: Install gpui's native build dependencies
        if: runner.os == 'Linux'
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates \
            curl \
            git \
            xz-utils \
            build-essential \
            cmake \
            clang \
            lld \
            llvm \
            pkg-config \
            libfontconfig-dev \
            libwayland-dev \
            libx11-xcb-dev \
            libxkbcommon-x11-dev \
            libssl-dev

      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # The runner's own toolchain lives outside the container.
      - name: Install Rust
        if: runner.os == 'Linux'
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --no-modify-path --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Install clippy and rustfmt
        run: rustup component add clippy rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Set node version to 26
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm

      - name: Install deps
        run: pnpm ci

      # tests/js_core_integration.rs reads this package's dist/ off disk.
      - name: Build the incajs package
        run: pnpm --filter incajs build

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check
        run: cargo check --workspace --all-targets

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

  rust-macos:
    name: "Rust: macos-latest"
    needs: changed
    if: needs.changed.outputs.rust == 'true'
    timeout-minutes: 30
    runs-on: macos-latest
    steps: *rust_steps

  # One status check whose name survives changes to the jobs above.
  passed:
    name: CI Passed
    if: always()
    needs: [changed, build, lint, test-node-22, test-node-24, test-node-26, rust-ubuntu, rust-macos]
    runs-on: ubuntu-latest
    steps:
      - name: Check job results
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
