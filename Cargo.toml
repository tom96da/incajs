#:schema https://json.schemastore.org/cargo.json

# Copyright (c) 2026 tom96da
# SPDX-License-Identifier: MIT OR Apache-2.0

[workspace]
resolver = "3"
members = ["crates/*", "tests"]
default-members = ["crates/inca-gpui"]

[workspace.package]
version = "0.0.11"
edition = "2024"
rust-version = "1.98"
license = "MIT OR Apache-2.0"
authors = ["tom96da"]
repository = "https://github.com/tom96da/incajs"
homepage = "https://incajs.tom96da.com/"
readme = "README.md"
keywords = ["gpui", "quickjs", "desktop-app", "gui", "webview-free"]

[workspace.dependencies]
env_logger = "0.11"
gpui = { git = "https://github.com/zed-industries/zed", tag = "v1.22.0" }
gpui_platform = { git = "https://github.com/zed-industries/zed", tag = "v1.22.0" }
rquickjs = { version = "0.14.0", default-features = false, features = ["std", "loader"] }
log = "0.4"
async-channel = "2.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-width = "0.2"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "warn"
unwrap_used = "warn"
unreadable_literal = "allow"

[profile.release]
strip = "symbols"
codegen-units = 1
lto = "thin"
panic = "abort"

# See patches/README.md.
[patch."https://github.com/zed-industries/zed"]
ztracing = { path = "patches/ztracing" }
ztracing_macro = { path = "patches/ztracing_macro" }
